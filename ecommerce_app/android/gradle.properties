# Pin the Gradle/Kotlin daemon to a supported JDK. JAVA_HOME on this machine
# points at VS Code's bundled Temurin 26, whose version string ("26.0.2.1")
# crashes Gradle 8.11.1's Kotlin DSL compiler whenever a .gradle.kts script
# has to (re)compile. Java 17 is what AGP 8.9 expects anyway.
org.gradle.java.home=C:/Program Files/Java/jdk-17
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
